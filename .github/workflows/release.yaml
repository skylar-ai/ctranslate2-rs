name: Release Rust library
on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # crates.io's ct2rs belongs to upstream; forks publish to their own registries.
    if: github.repository == 'jkawamoto/ctranslate2-rs'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Publish
        run: |
          cargo publish -p ct2rs
          cargo publish -p ct2rs-platform
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
